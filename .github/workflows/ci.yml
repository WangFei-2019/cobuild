name: Verify CoBuild

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile
      - name: Run domain and authenticated HTTP tests
        run: node --test tests/*.test.mjs
      - name: Build production frontend
        run: node scripts/build.mjs
      - name: Build Pages entry and explicit demo
        run: node scripts/build-pages.mjs
      - name: Check local runtime configuration
        run: npm run doctor
      - name: Package isolated source and runtime files
        run: node scripts/package-release.mjs --out "$RUNNER_TEMP/cobuild-release"
      - name: Verify package integrity and allowlist
        run: node scripts/verify-release.mjs "$RUNNER_TEMP/cobuild-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobuild-${{ github.sha }}
          path: ${{ runner.temp }}/cobuild-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build self-contained image
        run: docker build --tag cobuild:ci .
      - name: Check container startup and health
        run: |
          trap 'docker rm -f cobuild-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name cobuild-ci --env COBUILD_PUBLIC_URL=https://smoke.invalid cobuild:ci
          for attempt in $(seq 1 30); do
            if docker exec cobuild-ci node -e "fetch('http://127.0.0.1:4173/api/health').then(async r=>{const j=await r.json();process.exit(r.ok&&j.ok&&j.authRequired?0:1)}).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          docker logs cobuild-ci
          exit 1
