# A standalone image deployment. Do not combine with compose.yaml.
services:
  app:
    image: ${COBUILD_IMAGE:?Set COBUILD_IMAGE to a GHCR digest or exact version}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      COBUILD_PUBLIC_URL: ${COBUILD_PUBLIC_URL:?Set the public HTTPS origin}
      COBUILD_DATA_DIR: /app/.local
      COBUILD_PORT: "4173"
      COBUILD_DOMAIN: ${COBUILD_DOMAIN:?Set the public domain}
      COBUILD_SETUP_TOKEN_FILE: /run/secrets/setup_token
      COBUILD_AI_API_KEY_FILE: /run/secrets/ai_api_key
      COBUILD_MAIL_API_KEY_FILE: /run/secrets/mail_api_key
      COBUILD_MAIL_TRANSPORT: ${COBUILD_MAIL_TRANSPORT:-resend}
      COBUILD_MAIL_SMTP_HOST: ${COBUILD_MAIL_SMTP_HOST:-smtp.qq.com}
      COBUILD_MAIL_SMTP_PORT: ${COBUILD_MAIL_SMTP_PORT:-465}
      COBUILD_MAIL_SMTP_USER: ${COBUILD_MAIL_SMTP_USER:-}
      COBUILD_MAIL_SMTP_PASSWORD_FILE: /run/secrets/mail_smtp_password
      COBUILD_MAIL_FROM: ${COBUILD_MAIL_FROM:-}
      COBUILD_MAIL_API_URL: ${COBUILD_MAIL_API_URL:-https://api.resend.com/emails}
      COBUILD_MAIL_TIMEOUT_MS: ${COBUILD_MAIL_TIMEOUT_MS:-8000}
      COBUILD_AI_BASE_URL: ${COBUILD_AI_BASE_URL:-}
      COBUILD_AI_MODEL: ${COBUILD_AI_MODEL:-}
      COBUILD_AI_RESPONSE_FORMAT: ${COBUILD_AI_RESPONSE_FORMAT:-json_schema}
      COBUILD_AI_TOKEN_PARAMETER: ${COBUILD_AI_TOKEN_PARAMETER:-max_completion_tokens}
      COBUILD_AI_TIMEOUT_MS: ${COBUILD_AI_TIMEOUT_MS:-30000}
      COBUILD_AI_MAX_TOKENS: ${COBUILD_AI_MAX_TOKENS:-6000}
      COBUILD_AI_THINKING: ${COBUILD_AI_THINKING:-}
    secrets: [setup_token, ai_api_key, mail_api_key, mail_smtp_password]
    volumes:
      - cobuild_data:/app/.local
    expose: ['4173']
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      COBUILD_DOMAIN: ${COBUILD_DOMAIN:?Set the public domain}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
secrets:
  setup_token:
    file: ./.secrets/setup_token
  ai_api_key:
    file: ./.secrets/ai_api_key
  mail_api_key:
    file: ./.secrets/mail_api_key
  mail_smtp_password:
    file: ${COBUILD_MAIL_SMTP_PASSWORD_FILE:-./.secrets/mail_smtp_password}
volumes:
  cobuild_data:
  caddy_data:
  caddy_config:
